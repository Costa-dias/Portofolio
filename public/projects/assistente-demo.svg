<rect x="0" width="230" height="720" fill="#191623"/><text x="28" y="50" fill="#fff" font-size="24" font-weight="700">JOAO DIAS</text><text x="28" y="78" fill="#ad9bc8" font-size="15">ASSISTENTE TI</text>
