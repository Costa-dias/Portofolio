<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Assistente de TI — ilustração da interface</title><desc id="desc">Demonstração com doze atendimentos fictícios e uma biblioteca técnica. Não representa registros reais.</desc>
